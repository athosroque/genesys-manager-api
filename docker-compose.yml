services:
  db:
    # Upgrade para postgres:16 só na migração para a VM (exige dump/restore do volume)
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      # Sem default: compose falha se a senha não vier do .env descriptografado
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-genesys_manager}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Sem "ports": Postgres só é alcançável pela rede interna do compose
    networks:
      - genesys-internal
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g

  backend:
    build:
      context: ./backend
    env_file:
      # Gerado por scripts/deploy.sh (sops -d) em tmpfs; nunca em disco persistente
      - ${GENESYS_ENV_FILE:-/run/genesys/.env}
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      COOKIE_DOMAIN: ""
      CORS_ORIGINS: "https://genesys.projetoathos.com.br"
    restart: unless-stopped
    # Persistência fora da imagem: recreate não apaga magic links nem users.
    # Criar auth_tokens.json no host antes do primeiro up se o arquivo não existir
    # (Docker monta diretório se o path do arquivo estiver ausente).
    volumes:
      - ./backend/users.json:/app/users.json
      - ./backend/auth_tokens.json:/app/auth_tokens.json
    expose:
      - "8000"
    depends_on:
      - db
    networks:
      - genesys-internal
      - genesys-egress
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      # Padrão: só loopback (cloudflared na mesma VM + SSH tunnel).
      # No host antigo, cujo cloudflared está em outra máquina, use FRONTEND_BIND=0.0.0.0.
      - "${FRONTEND_BIND:-127.0.0.1}:8082:8080"
    depends_on:
      - backend
    networks:
      - genesys-internal
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m

  cloudflared:
    # Ativado só na VM: docker compose --profile tunnel up -d
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    networks:
      - genesys-internal
      - genesys-egress
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

networks:
  # Sem rota para fora: db nunca fala com a internet
  genesys-internal:
    name: genesys-internal
    internal: true
  # Saída para Genesys/Resend/Cloudflare
  genesys-egress:
    name: genesys-egress

volumes:
  postgres_data:
