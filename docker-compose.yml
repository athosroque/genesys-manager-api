version: "3.9"

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-genesys_manager}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - genesys-net
    ports:
      - "5432:5432"

  backend:
    build: 
      context: ./backend
    env_file: 
      - ./backend/.env
    # Override só o necessário para cookies/CORS em stack local (HTTP :8082).
    # APP_BASE_URL NÃO é sobrescrito aqui: vem do backend/.env (produção:
    # https://genesys.projetoathos.com.br). Esta stack também serve o domínio
    # público — magic links precisam da URL pública, não de localhost.
    environment:
      ENVIRONMENT: development
      COOKIE_DOMAIN: ""
      CORS_ORIGINS: "http://localhost:8082,http://localhost:5173,https://genesys.projetoathos.com.br"
    restart: unless-stopped
    # Persistência fora da imagem: recreate não apaga magic links nem users.
    # Criar auth_tokens.json no host antes do primeiro up se o arquivo não existir
    # (Docker monta diretório se o path do arquivo estiver ausente).
    volumes:
      - ./backend/users.json:/app/users.json
      - ./backend/auth_tokens.json:/app/auth_tokens.json
      - ./backend/tickets_enriched.db:/app/tickets_enriched.db
    expose:
      - "8000"
    depends_on:
      - db
    networks:
      - genesys-net

  frontend:
    build: 
      context: ./frontend
    restart: unless-stopped
    ports:
      - "8082:80"
    depends_on:
      - backend
    networks:
      - genesys-net

networks:
  genesys-net:
    name: genesys-net
    driver: bridge

volumes:
  postgres_data:
