services:
  backend:
    build:
      context: ./backend
    env_file:
      # Gerado por scripts/deploy.sh (sops -d) em tmpfs; nunca em disco persistente
      - ${GENESYS_ENV_FILE:-/run/genesys/.env}
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      COOKIE_DOMAIN: ""
    restart: unless-stopped
    # Persistência fora da imagem: recreate não apaga magic links nem users.
    # Criar auth_tokens.json no host antes do primeiro up se o arquivo não existir
    # (Docker monta diretório se o path do arquivo estiver ausente).
    volumes:
      - ./backend/users.json:/app/users.json
      - ./backend/auth_tokens.json:/app/auth_tokens.json
    expose:
      - "8000"
    networks:
      - genesys-internal
      - genesys-egress
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      # Padrão: só loopback (cloudflared na mesma VM + SSH tunnel).
      # No host antigo, cujo cloudflared está em outra máquina, use FRONTEND_BIND=0.0.0.0.
      - "${FRONTEND_BIND:-127.0.0.1}:8082:8080"
    depends_on:
      - backend
    networks:
      - genesys-internal
      # Docker >= 28 não publica portas de container só em rede internal
      - genesys-publish
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m

  cloudflared:
    # Ativado só na VM: docker compose --profile tunnel up -d
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    # http2 (TCP 443): o firewall do Proxmox não libera o QUIC (UDP 7844)
    command: tunnel --no-autoupdate --protocol http2 run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    networks:
      - genesys-internal
      - genesys-egress
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

networks:
  # Sem rota para fora: frontend nunca fala com a internet; backend e
  # cloudflared saem só pela genesys-egress
  genesys-internal:
    name: genesys-internal
    internal: true
  # Saída para Genesys/Resend/Cloudflare
  genesys-egress:
    name: genesys-egress
  # Só para publicar 127.0.0.1:8082 do frontend. Sem masquerade não há NAT de
  # saída, então o frontend continua sem acesso à internet.
  genesys-publish:
    name: genesys-publish
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
