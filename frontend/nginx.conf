server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # index.html sem cache — evita SPA antiga apontando para chunks/API antigos
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # SPA routing - importante para o Vue Router (history mode)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy para o backend FastAPI (estripa o prefixo /api)
    # Ex: /api/users -> http://backend:8000/users
    # Deep search de auditoria pode levar minutos — default nginx (60s) gerava HTTP 504.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        # Facilita verificar no curl que o proxy longo está ativo
        add_header X-Proxy-Read-Timeout 300 always;
    }
}
